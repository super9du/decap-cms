<style>
  .report-dates {
    --range-surface: #f6f8fc;
    --range-field: #fff;
    --range-text: #192434;
    --range-muted: #465671;
    --range-line: #adb9ca;
    --range-accent: #254ba8;
    --range-selected: #e5eeff;
    --range-error: #962d34;
    color-scheme: light;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 16px;
    margin: 0 0 18px;
    padding: 12px;
    border: 1px solid var(--range-line);
    border-radius: 10px;
    background: var(--range-surface);
    color: var(--range-text);
  }
  html.dark .report-dates {
    --range-surface: #242938;
    --range-field: #191e2a;
    --range-text: #f0f3ff;
    --range-muted: #c3cce0;
    --range-line: #67758e;
    --range-accent: #cabdff;
    --range-selected: #433863;
    --range-error: #ffc1c4;
    color-scheme: dark;
  }
  .report-dates .date-presets, .report-dates .date-inputs {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    margin: 0;
  }
  .report-dates label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    color: var(--range-muted);
    font-weight: 500;
  }
  .report-dates button, .report-dates input {
    min-height: 35px;
    padding: 4px 9px;
    border: 1px solid var(--range-line);
    border-radius: 6px;
    background: var(--range-field);
    color: var(--range-text);
    font: inherit;
  }
  .report-dates button:focus-visible, .report-dates input:focus-visible {
    outline: 2px solid var(--range-accent);
    outline-offset: 2px;
  }
  .report-dates button:hover, .report-dates button[aria-pressed="true"] {
    border-color: var(--range-accent);
  }
  .report-dates button[aria-pressed="true"] {
    background: var(--range-selected);
    color: var(--range-text);
  }
  .report-dates small {
    flex-basis: 100%;
    color: var(--range-muted);
  }
  .report-dates .date-error {
    flex-basis: 100%;
    margin: 0;
    color: var(--range-error);
  }
  .report-dates [hidden] { display: none; }
</style>
<section class="report-dates" aria-label="统计日期" data-today="$today">
  <div class="date-presets" role="group" aria-label="快捷日期">$presets</div>
  <div class="date-inputs" role="group" aria-label="自定义日期">
    <label>开始 <input name="from" type="date" value="$start" min="$first" max="$today" required></label>
    <label>结束 <input name="to" type="date" value="$end" min="$first" max="$today" required></label>
    <button type="button" class="date-apply">应用日期</button>
  </div>
  <small>可查询 $first 至 $today · $timezone</small>
  <p class="date-error" role="alert" $error_hidden>$error</p>
</section>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const toolbar = document.querySelector('.report-dates');
    const from = toolbar.querySelector('[name="from"]');
    const to = toolbar.querySelector('[name="to"]');
    const error = toolbar.querySelector('.date-error');

    function selectRange(start, end, preset) {
      const params = new URLSearchParams({from: start, to: end});
      if (preset) params.set('preset', preset);
      const theme = window.GoAccess?.AppPrefs?.theme;
      if (theme) params.set('theme', theme);
      window.location.search = params.toString();
    }

    for (const button of toolbar.querySelectorAll('[data-start]')) {
      button.addEventListener('click', () => selectRange(button.dataset.start, toolbar.dataset.today, button.dataset.preset));
    }
    toolbar.querySelector('.date-apply').addEventListener('click', () => {
      if (!from.reportValidity() || !to.reportValidity()) return;
      if (from.value > to.value) {
        error.textContent = '开始日期不得晚于结束日期。';
        error.hidden = false;
        from.focus();
        return;
      }
      selectRange(from.value, to.value);
    });

    const access = window.GoAccess;
    if (!access?.Panels?.renderPanels) return;
    const render = access.Panels.renderPanels;
    access.Panels.renderPanels = function (...args) {
      const {vhosts, ...panels} = access.getPanelUI();
      if (vhosts) {
        const entries = Object.entries(panels);
        const visible = entries.filter(([key]) => !access.Util.isPanelValid(key) && !access.Util.isPanelHidden(key));
        const layout = access.getPrefs().layout;
        const beforeHost = Math.min(visible.length, layout === 'wide' ? 3 : 1);
        const last = visible[beforeHost - 1];
        entries.splice(last ? entries.indexOf(last) + 1 : 0, 0, ['vhosts', vhosts]);
        access.AppUIData = Object.fromEntries(entries);
      }
      return render.apply(this, args);
    };
  });
</script>
